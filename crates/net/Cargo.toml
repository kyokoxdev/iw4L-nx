[package]
name = "net"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Our wire: frames, deltas, prediction, interpolation. Not retail's netcode."

[dependencies]
structured_data_iw4.workspace = true
diag.workspace = true
math_iw4.workspace = true
frame.workspace = true
playerstate_iw4.workspace = true
entity_iw4.workspace = true
anim_iw4.workspace = true
xmodel_runtime.workspace = true
movement_iw4.workspace = true
input_iw4.workspace = true
weapon_iw4.workspace = true
gamemode_iw4.workspace = true
killcam_iw4.workspace = true
sim.workspace = true
hud_iw4.workspace = true
perf.workspace = true
bevy.workspace = true
master_protocol.workspace = true
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
zstd = { version = "0.13", default-features = false }

# Master server QUIC transport. Horizon (Switch) is offline-only: no mio/ring
# backend there, so the master bridge reports "online unavailable" instead.
[target.'cfg(not(target_os = "horizon"))'.dependencies]
quinn = { version = "0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23.31", default-features = false, features = ["ring", "std"] }
ring = "0.17.14"
tokio = { version = "1.47", features = ["net"] }
updater = { path = "../updater" }

# Account identity without ring, which builds no aarch64 assembly for Horizon.
# Ed25519 is deterministic: same keys, account ids and signatures as ring.
[target.'cfg(target_os = "horizon")'.dependencies]
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize"] }
getrandom = "0.3"
sha2.workspace = true

[dev-dependencies]
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize"] }
getrandom = "0.3"
sha2.workspace = true

[lints]
workspace = true
