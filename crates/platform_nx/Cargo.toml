[package]
name = "platform_nx"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Nintendo Switch (Horizon) platform layer: libnx link, libc gaps, Bevy runner. Empty on other targets."

[target.'cfg(target_os = "horizon")'.dependencies]
bevy.workspace = true
getrandom = "0.4"
raw-window-handle = "0.6"
# Unifies into bevy_render's wgpu: the GL backend is the only one on Horizon.
wgpu = { version = "29", default-features = false, features = ["gles"] }

[lints]
workspace = true
