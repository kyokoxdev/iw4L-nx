[package]
name = "launcher"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The binary. Process entry only: allocator, argv, env, log init; assembly lives in bootstrap."

[[bin]]
name = "iw4l"
path = "src/main.rs"

[features]
bevy-debug = ["bootstrap/bevy-debug"]
bevy-trace = ["bootstrap/bevy-trace"]
span-profile = ["bootstrap/span-profile"]
heap-samples = ["platform_nx/heap-samples"]

[dependencies]
diag.workspace = true
asset_transport.workspace = true
bootstrap = { path = "../bootstrap" }

# Community descriptor and self-update; none on Switch.
[target.'cfg(not(target_os = "horizon"))'.dependencies]
updater = { path = "../updater" }

# Pins the libc that build-std's std uses to the patched fork (root Cargo.toml).
[target.'cfg(target_os = "horizon")'.dependencies]
libc = "=0.2.189"
platform_nx.workspace = true

[lints]
workspace = true
