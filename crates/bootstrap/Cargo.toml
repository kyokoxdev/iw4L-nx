[package]
name = "bootstrap"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Composition root: assembles the bevy App for menu / map / play runs."

[features]
bevy-debug = ["bevy/debug", "bevy/track_location"]
# Bevy's own `tracing` spans, written as a Chrome trace beside the binary.
#
# Off by default and never on in a timed run: the subscriber costs the frame
# it measures. It exists because the spans inside bevy's render graph — the
# `queue_submit` around `RenderQueue::submit`, the ones inside
# `RenderContext::apply` — are the only place a submit can be timed from, and
# this runtime's own Perfetto capture does not contain them. A diagnostic run
# on this feature is what turns "the interval across bevy's submit set was
# long" into a statement about where the time went.
bevy-trace = ["bevy/trace", "bevy/trace_chrome"]
# The same spans summed in-process and logged every few seconds: the Switch
# build's profiler (`span_profile.rs`). `bevy/debug` keeps system names;
# without it every system span reads "<Enable the debug feature ...>".
# `profiling` turns wgpu-core's `profiling::scope!`s (Queue::submit, present,
# render pass recording) into spans, splitting the graphics layer's time.
span-profile = ["bevy/trace", "bevy/debug", "dep:profiling"]

[dependencies]
profiling = { version = "1", optional = true, features = ["profile-with-tracing"] }
bevy.workspace = true
asset_audio.workspace = true
asset_core.workspace = true
asset_game.workspace = true
asset_material.workspace = true
asset_transport.workspace = true
assets.workspace = true
audio.workspace = true
console.workspace = true
diag.workspace = true
frame.workspace = true
master_protocol.workspace = true
render.workspace = true
render_gpu.workspace = true
render_frontend.workspace = true
sim.workspace = true
net.workspace = true
ui.workspace = true
replay.workspace = true
theater.workspace = true
session.workspace = true
bots = { path = "../bots" }
hud = { path = "../hud" }
perf.workspace = true
sha2.workspace = true
serde_json.workspace = true

# Desktop windowing/input. Horizon has no winit/gilrs backend; platform_nx
# supplies the runner and pad input there.
[target.'cfg(not(target_os = "horizon"))'.dependencies]
bevy = { workspace = true, features = ["bevy_winit", "bevy_gilrs", "x11", "wayland", "system_clipboard"] }

[target.'cfg(target_os = "horizon")'.dependencies]
platform_nx.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[lints]
workspace = true
