[package]
name = "bake"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "iw4l-bake: offline deko3d shader bake for the Switch build."

[[bin]]
name = "iw4l-bake"
path = "src/main.rs"

[dependencies]
asset_core.workspace = true
asset_material.workspace = true
asset_transport.workspace = true
assets.workspace = true
bevy.workspace = true
frame.workspace = true
master_protocol.workspace = true
render_frontend.workspace = true
render_gpu.workspace = true
wgpu = { version = "30", default-features = false, features = ["noop", "wgsl"] }
wgpu-hal = { version = "30", features = ["deko3d-bake"] }

[build-dependencies]
cc = "1.4"

[lints]
workspace = true
